defaults:
  - _self_
  - planner: mpc_rrt

hydra:
  run:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}
  sweep:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}
    subdir: ${hydra.job.num}

# model to load for planning. Resolves to <cwd>/outputs/<model_name>/ (hydra.yaml
# + checkpoints/model_<epoch>.pth). 2026-06-17 = the single-robot WM (15 epochs).
ckpt_base_path: ./ # put absolute path here. Checkpoints will be loaded from ${ckpt_base_path}/outputs
model_name: 2026-06-25/16-46-57  # 1500-ep set (data/isaaclab_stroke_1500), parked-arm + mixed sampler
model_epoch: 20  # best saved: one-step val ~0.058, visual rollout val ~0.142 (~2x sharper than the 300-ep WM's 0.25)

# GPU for the WM + sim/renderer. HARNESS: AppLauncher derives the renderer's
# active_gpu + physics_gpu from this, so e.g. device=cuda:7 puts rendering on GPU 7.
device: cuda:0

# HARNESS: cap how deep into an episode a sampled segment can start (offset in [0, max_offset]).
# Smaller = init nearer the episode start (cleaner teleport); large = can start mid-trajectory.
max_offset: 50

# Optional: override the dataset data_path baked into the training config.
# Useful when planning in a container where the repo is mounted at a different
# prefix than during training (e.g. /workspace/dino_wm vs /newdata2/...).
# Leave null to use the path stored in the model's hydra.yaml.
data_path: null

# Optional: attach a standalone-trained decoder so the evaluator renders the IMAGINED
# rollout (top=executed sim, bottom=decoded WM prediction) into output_final.png + .mp4.
# The WM's own config has has_decoder=False; setting these overrides it at plan time
# (mirrors the data_path override in plan.py). decoder_path is relative to the repo root.
# Both null = no decoder (executed-only video). e.g.:
#   has_decoder=true decoder_path=outputs/2026-07-08/16-26-03/checkpoints/model_20.pth
has_decoder: true
decoder_path: outputs/2026-07-08/16-26-03/checkpoints/model_15.pth

seed: 99
n_evals: 3
goal_source: 'dset' # 'random_state' or 'dset' or 'random_action' 
goal_H: 5 # specifies how far away the goal is if goal_source is 'dset'
n_plot_samples: 10

# Render EVERY internal sim step into the executed video (smooth playback) instead of
# only stroke-boundary frames. Off by default (per-step PathTracing is slow); turn on to
# eyeball what the planner did. Hydra syntax: `video=true` (this is a Hydra app, not argparse).
video: false

# Render all envs into ONE tiled render product (TiledCamera) instead of a per-env Camera.
# Far lower RTX memory + faster -> a much higher n_evals ceiling before render OOM. Each env
# still sees only its own frame. OFF by default (data collection + standalone runs keep the
# per-env Camera); eval_sweep.py sets it. Hydra: tiled_camera=true
tiled_camera: false

# CEM diagnostic (Hydra: `cem_debug=true`): per sub-planner solve, print the SPREAD of
# objective scores across sampled actions (tiny spread => WM/objective can't tell actions
# apart) and the GT (dataset) action's score vs the winner (does the objective rate the
# truly-good action best?). Off by default.
cem_debug: false

# RRT/MPC introspection (planner=mpc_rrt). Per re-plan step, dump the top-K branches
# (probe-xy path, predicted cell path, committed first stroke), a 2D tree plot, decoded
# imagined strips, and -- if resim -- the top-K branches re-run through the REAL sim with
# imagined-vs-realized disparity + ranking-inversion metrics. Writes rrt_introspect/ +
# summary.json in the run dir. OFF by default (resim adds renders). Hydra: rrt_introspect.enabled=true
rrt_introspect:
  enabled: false
  top_k: 5
  resim: true      # Tier 2: re-simulate the top_k branches in the real sim (extra PathTracing renders)
  max_evals: 3     # cap how many parallel evals to instrument

debug_dset_init: False

# Legislation: enforce DDL-derived constraints in the planner (the "social" agent).
# enforce=false reproduces the unconstrained planner (the "selfish" agent). facts = the base
# facts that fire the laws (the centre-cell law's antecedent is `cube`). Wired into the chained
# aimed planner (planner=mpc_cem_aimed_chained). See legislation/{reasoner,constraint}.py.
legislation:
  enforce: true
  facts: [cube]
  violation_penalty: 1.0e6

# Scene filter: restrict goal selection to episodes with chosen properties so a law test gets
# relevant scenarios. via_cell = the straight init->goal path must cross this cell (set 4 = centre
# so the centre-cell law actually forces a detour). null = off. (scripts/scene_index aggregates
# these offline; this applies them in plan.py's sampler.)
scene_filter:
  via_cell: null      # e.g. 4 (centre) for the centre-cell law test
  goal_color: null    # e.g. yellow
  goal_cell: null
  init_color: null
  init_cell: null
  # Drop segments whose GOAL-cube FOOTPRINT overlaps any of these cells (not just its centroid).
  # Cleans out goals that sit partly in a forbidden cell -- otherwise closing euclidean distance to
  # them drags the cube INTO that cell, unfairly penalising the law. e.g. goal_not_in_cells=[4].
  goal_not_in_cells: null

# POOL SWEEP: when set (int), run the DETERMINISTIC slice pool[scene_offset : scene_offset+n_evals]
# of matching segments -- one eval per distinct dataset scenario, no shuffle/seed-repeat. n_evals is
# clamped to the available slice. The eval_sweep.py harness walks this offset to cover the whole
# pool in OOM-safe batches. null = normal behaviour (shuffled pool / random sampling).
scene_offset: null

# Cell to SCORE entering for the law-abidance metric (eval_metrics.json), independent of the
# scene_filter. Lets the SELFISH agent (no constraint) still be scored on the forbidden cell, and
# lets one metric cell apply across many init/goal pairs. null = score only the constraint's cells.
metric_cell: null

objective:
  # HARNESS EDIT: probe-based objective (independent of create_objective_fn).
  # A/B the probe vs the MSE baseline with one flag:
  #   probe-driven : python plan.py ... objective.use_probe=true   (default)
  #   MSE baseline : python plan.py ... objective.use_probe=false
  _target_: planning.objectives.create_probe_objective_fn
  alpha: 0.0 # proprio (arm-pose) term OFF: arm is parked/task-irrelevant, and its embedding-MSE scale (~26) was swamping the cube term
  base: 2 # coeff base for weighting all frames. Only applies when mode == 'all'
  mode: last
  probe_lambda: 1.0 # legislation P(illegal) penalty (separate probe; inert in GD, used in cem.py)
  use_probe: true # probe gives a SHARP cube-position objective (latent MSE alone barely weights the few cube patches)
  pos_probe_path: probes/weights/probe_cube_1500.pth # trained on data/isaaclab_stroke_1500 (interior cell-acc 0.999, L2 ~0.015m)
  pos_probe_weight: 50.0 # PRIMARY. squared-L2 in m^2 (~0.03 for a 1-cell error); large so cube term dominates latent MSE (O(0.1-1))
  visual_weight: 0.1 # weak manifold regularizer only (limits probe-gaming); demoted so the cube-position probe dominates
