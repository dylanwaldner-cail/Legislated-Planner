name: isaaclab_grid
args: []
kwargs:
  task_id: Isaac-DinoWMGrid-Single-v0
  num_envs: 1
  device: "cuda:0"

dataset:
  _target_: "datasets.isaaclab_grid_dset.load_isaaclab_single_slice_train_val"
  n_rollout: null
  normalize_action: ${normalize_action}
  # Absolute path (Hydra changes cwd at startup, so a relative ./data would
  # resolve under the output dir). ckpt_base_path is the repo root.
  # Planar-stroke dataset (actions (E,T,4)); collected by collect_isaaclab_grid_data.py.
  data_path: ${ckpt_base_path}/data/isaaclab_stroke_1500
  split_ratio: 0.9
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 4
