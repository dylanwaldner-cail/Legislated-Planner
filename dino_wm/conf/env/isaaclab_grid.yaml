name: isaaclab_grid
args: []
kwargs:
  task_id: Isaac-DinoWMGrid-v0
  num_envs: 1
  device: "cuda:0"
  cooperative: True

dataset:
  _target_: "datasets.isaaclab_grid_dset.load_isaaclab_grid_slice_train_val"
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR}/isaaclab_grid
  split_ratio: 0.9
  cooperative: True
  camera: left  # or "right"; one model per robot, two training configs
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 4
