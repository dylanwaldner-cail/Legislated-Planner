_target_: planning.mpc.MPCPlanner
# CLOSED-LOOP RRT: rebuild the WHOLE tree from a FRESH real observation every step, execute only
# the FIRST stroke, re-observe, repeat. The deep part of each tree (where the WM is past its
# reliable horizon H*=4) only informs WHICH WAY the first stroke goes -- it's discarded and
# recomputed next step, so we never COMMIT to the WM's unreliable lookahead. Inefficient (a full
# global re-plan per stroke) but the right use of a shallow-lookahead model.
max_iter: 12         # finite cap; one stroke per iter, enough for a multi-stroke detour
n_taken_actions: 1   # commit only the first stroke, then re-observe + re-plan the tree
sub_planner:
  target: planning.rrt.RRTPlanner
  max_samples: 256   # tree nodes per re-plan (rebuilt every step; raise if it can't find a route)
  batch_size: 64     # aimed strokes per extend; keep the one closest to the sampled target
  goal_tol: 0.06     # cube within this (m) of the goal cube == reached (< CELL/2 = 0.067)
  goal_bias: 0.2     # P(extend toward the goal vs a random grid point)
  push_min: 0.05     # per-stroke cube-travel range (matches the data sampler band)
  push_max: 0.09
  max_path: 20       # cap on path length (strokes)
  aim_back: 0.12     # standoff behind the cube (matches mpc_cem_aimed)

name: mpc_rrt
