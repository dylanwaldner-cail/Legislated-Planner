_target_: planning.mpc.MPCPlanner
# CLOSED-LOOP RRT: rebuild the WHOLE tree from a FRESH real observation every step, execute only
# the FIRST stroke, re-observe, repeat. The deep part of each tree (where the WM is past its
# reliable horizon H*=4) only informs WHICH WAY the first stroke goes -- it's discarded and
# recomputed next step, so we never COMMIT to the WM's unreliable lookahead. Inefficient (a full
# global re-plan per stroke) but the right use of a shallow-lookahead model.
max_iter: 12         # finite cap; one stroke per iter, enough for a multi-stroke detour
n_taken_actions: 1   # commit only the first stroke, then re-observe + re-plan the tree
success_hold: true   # freeze SUCCEEDED evals with a zero-disp hold so a solved eval can't wander back
                     # into an illegal cell (post-success breaches are spurious). Trade-off: the hold
                     # reads the GROUND-TRUTH cube (one non-probe read; near-irrelevant for a zero-disp
                     # hold) and biases the per-step WM-error curve (held evals contribute ~0 movement).
sub_planner:
  target: planning.rrt.RRTPlanner
  max_samples: 512   # extend attempts per re-plan (rebuilt every step). Higher = tree completes the
                     # detour to the goal more often -> less greedy best-effort fallback -> less
                     # oscillation. NB: most attempts get pruned, so the tree stays ~10-40 nodes;
                     # cost scales ~linearly (each is a WM rollout). BREADTH, not depth (max_path).
  batch_size: 64     # aimed strokes per extend; keep the one closest to the sampled target
  goal_tol: 0.06     # cube within this (m) of the goal cube == reached (< CELL/2 = 0.067)
  goal_bias: 0.5     # P(extend toward the goal vs a random grid point)
  push_min: 0.05     # per-stroke cube-travel range (matches the data sampler band)
  push_max: 0.09
  max_path: 3        # cap on path length (strokes). Capped at WM reliable horizon H*~=4: deeper
                     # branches are open-loop rollouts past the WM's capacity (garbage latents ->
                     # meaningless geometry + drift-poisoned constraint checks). MPC re-plans every
                     # step and commits only the first stroke, so far goals still solve across steps.
  aim_back: 0.12     # standoff behind the cube (matches mpc_cem_aimed)
  steer_cone_deg: 90 # sample push directions within +/-45deg of the bearing to the sampled target
                     # (a stochastic steering fn) instead of blind uniform. Set 360 for the old
                     # target-agnostic uniform sampling (A/B baseline). Spread should cover the WM heading err.
  deviant_lambda: 0.067  # DEVIANT only: meters-of-progress one law-violation is worth. Deviant minimizes
                     # dist-to-goal + lambda*violations, so it crosses a forbidden cell only when that
                     # saves > lambda per violation, and always prefers a 0-violation route (cost 0).
                     # 0.067 = half a cell (CELL/2). lambda->inf == social; lambda==0 == rational/off.
                     # Inert for social/off (they prune violators). Report this value with deviant results.

name: mpc_rrt
