defaults:
  - _self_
  - env: isaaclab_stub
  - override hydra/launcher: basic

ckpt_base_path: ./checkpoints
model_name: isaaclab_stub
model_epoch: latest

hydra:
  run:
    dir: probe_outputs/${now:%Y%m%d%H%M%S}_${model_name}
  sweep:
    dir: probe_outputs/${now:%Y%m%d%H%M%S}_${model_name}
    subdir: ${hydra.job.num}

probe:
  # Stub probe input/output not finalized; placeholder shapes.
  input_dim: 788
  lr: 3e-4
  batch_size: 64
  epochs: 10
  num_batches: 100
  # No illegal region defined for the stub; planner code paths still work
  # because probe_lambda defaults to 0.0 in plan_isaaclab_stub.yaml.
  illegal_region:
    x_min: 0.0
    x_max: 0.0
    y_min: 0.0
    y_max: 0.0
  init_state: null
  goal_state: null

training:
  seed: 0
  num_workers: 2
  pool: mean_patch
  save_every_x_epoch: 1
  wandb_logging: false
  num_samples: 100
  topk: 10
  log_every_traj: 25
  rollout_horizon: 5
  alpha: 1
  base: 1
  objective_mode: 'last'
  db_path: ${oc.env:DATASET_DIR}/isaaclab_stub/wm_traj.h5
  num_iterations: 2

data:
  root: ${oc.env:DATASET_DIR}/isaaclab_stub
  states: ${data.root}/states.pth
  actions: ${data.root}/actions.pth
  seq_lengths: ${data.root}/seq_lengths.pth
  obses_dir: ${data.root}/obses
  num_episodes: 50

img_size: 224
frameskip: 1
concat_dim: 1

normalize_action: True

action_emb_dim: 10
num_action_repeat: 1

proprio_emb_dim: 10
num_proprio_repeat: 1

num_hist: 3
num_pred: 1
has_predictor: True
has_decoder: True
