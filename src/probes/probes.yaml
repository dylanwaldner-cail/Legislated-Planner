# Probe registry manifest — each probe reads one aspect of the scene off a WM latent.
# probes/registry.py loads the enabled ones. `kind` and `source` are read from each .pth
# (source = which latent the probe was trained on: 'encoded' = phi(real frame),
# 'predicted' = WM-rolled latent). The registry groups by source so the caller feeds the
# matching latent to each group. To add a probe: train it, drop the .pth here, flip enabled.

probes:
  - name: cube_position          # continuous cube (x,y) in meters   [regression, encoded-only]
    path: probes/weights/cube_pos_encoded.pth   # FALLBACK default only: at plan time plan.py OVERRIDES this with
    enabled: true                            # objective.pos_probe_path, so legislation & planner ALWAYS share one probe (no mismatch).

  - name: cube_position_pred     # cube (x,y) read off predicted latents   [regression, predicted]
    path: probes/weights/probe_cube_pred.pth
    enabled: false               # the 1-5 mix was a wash at h<=2 (chaining diag); enable when retrained per-horizon

  - name: cube_cells             # per-cell occupancy, 9-d multi-label   [multilabel, encoded]
    path: probes/weights/legacy/probe_cube_cells.pth
    enabled: false               # OUTDATED — legislation now uses the position probe + privileged cell geometry
                                 # (probe_cube_cells.py still provides swept_cells/gm helpers). Weights moved to legacy/.

  - name: sign_color             # stop-sign colour, 4-class {white,red,yellow,green}   [classification, encoded]
    path: probes/weights/probe_sign_color.pth   # RETRAIN on the current data (isaaclab_stroke_5k) — the OLD probe_sign_color.pth
                                 # (now in probes/weights/legacy/) was pre-refactor. Encoded/WM-independent, but must match the
                                 # current env's sign rendering. Train+save:
                                 #   probe_sign_color.py --data_dir data/isaaclab_stroke_5k --save_path probes/weights/probe_sign_color.pth
    enabled: true                # ENABLED 2026-08-03: held-out balanced_acc 1.0 (probe_sign_color.pth.metrics.json,
                                 # 4-class, current shift025 data) clears the >=95% gate. Required by the sign-change
                                 # experiment (experiments/sign_change/) — sign(...) laws are DORMANT until enabled.


  # - name: cube_cells_pred      # per-cell occupancy on predicted latents   [multilabel, predicted]
  #   path: probes/weights/probe_cube_cells_pred.pth   # train: probe_cube_cells.py --source predicted --pred_horizons 1,2,3,4,5
  #   enabled: false

  # - name: cube_yaw           # cube yaw MOD 90deg as (sin 4t, cos 4t)   [yaw_mod90_sincos4, encoded]
  #   path: probes/weights/probe_cube_yaw.pth
  #   enabled: false           # DELIBERATELY not enabled here: turning it on would switch EVERY run
  #                            # from the axis-aligned body model to the true oriented one at once.
  #                            # Opt in per-run instead:  DINOWM_YAW_PROBE=probes/weights/probe_cube_yaw.pth
  #                            # Held-out (encoded): 6.12 deg mean / 11.82 p90, footprint half-extent
  #                            # MAE 1.83 mm vs 12.48 mm for the fixed axis-aligned box.
  #                            # On PREDICTED latents (clean calib_1k, horizons 1-3, n=45k):
  #                            # 14.45 deg / 35.07 p90, extent MAE 4.22 mm vs 12.51 mm  -> 66% better.
