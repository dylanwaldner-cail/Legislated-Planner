defaults:
  - _self_
  - env: point_maze
  - override hydra/launcher: basic

ckpt_base_path: ./checkpoints
model_name: point_maze
model_epoch: latest

hydra:
  run:
    dir: probe_outputs/${now:%Y%m%d%H%M%S}_${model_name}
  sweep:
    dir: probe_outputs/${now:%Y%m%d%H%M%S}_${model_name}
    subdir: ${hydra.job.num}

probe:
  # Probe input is the concat of start and end state embeddings:
  #   start_visual_pool (384) + start_proprio (10) + end_visual_pool (384) + end_proprio (10) = 788.
  input_dim: 788
  lr: 3e-4
  batch_size: 256
  epochs: 30
  num_batches: 1000
  # U_MAZE reachable region (per env/pointmaze/point_maze_wrapper.py:32-33).
  # Anything outside these corridors is wall, so an illegal_region defined
  # outside them has no effect.
  #   - Left  corridor: x ∈ [0.5, 1.1], y ∈ [0.5, 3.1]
  #   - Top   corridor: x ∈ [1.1, 2.5], y ∈ [2.5, 3.1]
  #   - Right corridor: x ∈ [2.5, 3.1], y ∈ [0.5, 3.1]
  illegal_region:
    x_min: 0.5
    x_max: 0.9
    y_min: 1.3
    y_max: 2.6
  # Fixed init/goal for deterministic eval. Mirrors train_probe.py:44-45 so
  # plan.py and train_probe.py share a single source of truth. State layout
  # is [x, y, vx, vy] for PointMaze.
  init_state: [1.0, 1.0, 0.0, 0.0]
  goal_state: [3.0, 3.0, 0.0, 0.0]

training:
  seed: 0
  num_workers: 4
  pool: mean_patch
  save_every_x_epoch: 1
  wandb_logging: false
  num_samples: 1000
  topk: 100
  log_every_traj: 100   # gate per-step fidelity prints to once every N trajs
  rollout_horizon: 5
  alpha: 1
  base: 1
  objective_mode: 'last'
  db_path: /newdata2/dylantw/Legislated-Planner/src/wm_traj.h5
  num_iterations: 10

data:
  root: checkpoints/point_maze

  states: ${data.root}/states.pth
  actions: ${data.root}/actions.pth
  seq_lengths: ${data.root}/seq_lengths.pth

  obses_dir: ${data.root}/obses
  num_episodes: 1800


img_size: 224 # should be a multiple of 224
frameskip: 5
concat_dim: 1

normalize_action: True

# action encoder
action_emb_dim: 10
num_action_repeat: 1

# proprio encoder
proprio_emb_dim: 10
num_proprio_repeat: 1

num_hist: 3
num_pred: 1 # only supports 1
has_predictor: True # set this to False for only training a decoder
has_decoder: True # set this to False for only training a predictor
