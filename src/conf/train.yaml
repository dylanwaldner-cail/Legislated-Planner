defaults:
  - _self_
  - env: isaaclab_grid
  - encoder: dino
  - action_encoder: proprio
  - proprio_encoder: proprio
  - decoder: vqvae
  - predictor: vit

# base path to save model outputs. Checkpoints will be saved to ${ckpt_base_path}/outputs.
# Use the CONTAINER's bind-mounted repo path (/workspace/src), NOT the host path
# (/newdata2/...): training runs in the container, where /newdata2 is the ephemeral
# overlay (host-invisible, lost on recreate) and /workspace/src is the bind mount
# (== host /newdata2/.../dino_wm). Override if you ever train outside the container.
ckpt_base_path: /workspace/src/

hydra:
  run:
    dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

training:
  seed: 0
  epochs: 50  # val bottomed ~epoch 22-35 then overfit on the 500-ep run; 50 is plenty (checkpoints every 5)
  batch_size: 128 # HARNESS EDIT (speedup): bumped 64->128 — decoder VRAM is freed (has_decoder False) and bf16 halves activation memory. Lower to 64 if OOM.
  save_every_x_epoch: 5
  reconstruct_every_x_batch: 500
  num_reconstruct_samples: 6
  encoder_lr: 1e-6
  decoder_lr: 3e-4
  predictor_lr: 1e-3 # HARNESS EDIT: linear scaling from 5e-4 for the 2x batch (64->128). Drop to ~7e-4 if bf16+high-LR oscillates in the first ~5 epochs.
  action_encoder_lr: 1e-3 # HARNESS EDIT: scaled with predictor_lr (same 2x-batch reason).

img_size: 224 # should be a multiple of 224
# frameskip=1 for the planar-stroke action: one stroke == one model frame (no
# multi-step action concat). The generic slicer/rollout einops "(n f) d -> n (f d)"
# all collapse to identity at f=1. The isaaclab stroke dataset loader asserts this.
frameskip: 1
concat_dim: 1

normalize_action: True

# action encoder
action_emb_dim: 10
num_action_repeat: 1

# proprio encoder
proprio_emb_dim: 10 
num_proprio_repeat: 1

num_hist: 3
num_pred: 1 # only supports 1
has_predictor: True # set this to False for only training a decoder
# HARNESS EDIT (speedup): decoder is detached from the predictor (viz-only, unused in
# latent-space planning) and runs 2 heavy VQVAE decodes/step. Off = train predictor only.
# Re-enable + train a decoder separately when we want imagination viz back. See memory.
has_decoder: False # set this to False for only training a predictor

# Planner-domain upweighting: sample training slices whose PREDICTED stroke lies in the RRT's
# operating domain (aimed contacts -- aim ~0.10 m, disp ~0.15-0.19 m, cube actually moves) more
# often, to densify the region the planner actually queries (scripts/plot_query_vs_train.py showed
# the planner lives in a narrow sub-region of the broad training distribution). This is an EXPLICIT
# EXPERIMENT, OFF by default: nothing changes unless you set `planner_domain.enabled=true`. Applied
# to the TRAIN loader only, via a WeightedRandomSampler in train.py.
planner_domain:
  enabled: false       # EXPLICIT opt-in -- uniform sampling unless set true (planner_domain.enabled=true)
  weight: 4.0          # multiplier for in-domain slices when enabled (try 3-5 to densify)
  aim_lo: 0.085        # |stroke_start - cube| window (planner spike ~0.105 m)
  aim_hi: 0.125
  push_lo: 0.14        # |displacement| window (planner ~0.155-0.195 m)
  push_hi: 0.21
  contact_min: 0.02    # cube must move > this (m) to count as a contact

model:
  _target_: models.visual_world_model.VWorldModel
  image_size: ${img_size}
  num_hist: ${num_hist}
  num_pred: ${num_pred}
  train_encoder: False
  train_predictor: True
  train_decoder: False # HARNESS EDIT (speedup): keep consistent with has_decoder: False

debug: False 

# Planning params for planning eval jobs launched during training
plan_settings: 
  # plan_cfg_path: conf/plan.yaml # set to null for no planning evals
  plan_cfg_path: null 
  planner: ['gd', 'cem']
  goal_source: ['dset', 'random_state']
  goal_H: [5]
  alpha: [0.1, 1]
